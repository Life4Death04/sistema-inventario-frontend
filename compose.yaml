services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${FRONTEND_ENV_FILE:-.env.deploy}
    ports:
      - "127.0.0.1:10000:8080"
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    pids_limit: 100
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
